[package]
name = "xtp"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xtp-core.workspace = true
xtp-pe.workspace = true
xtp-loader.workspace = true
xtp-hle.workspace = true
xtp-shader = { workspace = true, features = ["host"] }
xtp-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "xtp-core/diagnostics",
    "xtp-hle/diagnostics",
    "xtp-loader/diagnostics",
    "xtp-shader/diagnostics",
]

[lints]
workspace = true
