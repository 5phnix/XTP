name: Game progress
description: How far the title gets on your machine with a given XTP commit
title: 'progress: <stage reached> on <GPU>'
labels: [game progress, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        A progress report tells us how far the title gets on hardware other than ours.
        One report per machine and commit; for a new commit, comment on your report.
        **Describe, don't capture**: no screenshots, video or files of the title
        ([asset policy](https://github.com/MiamiGame/XTP/blob/main/docs/asset-policy.md)).
  - type: dropdown
    id: stage
    attributes:
      label: Furthest stage reached
      options:
        - Does not start (error before the first frame)
        - Boot and first-boot screens
        - Intro video
        - Start screen, profile and saves
        - Loading into the world
        - The world renders (partly)
        - The world is playable
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: Frame rate
      description: As shown in the window caption, at the furthest stage.
      placeholder: 'menus 30 fps, world 0.8 s per frame'
  - type: textarea
    id: seen
    attributes:
      label: What you see
      description: What renders and what is missing or wrong, in words. Sound and input too.
    validations:
      required: true
  - type: textarea
    id: run-report
    attributes:
      label: Run report
      description: The block described in docs/dev/START_HERE.md, "Run report".
      render: text
      value: |
        xtp commit    :
        build         : release | diag
        title blake3  :
        console mode  : series-x | series-s
        windows       :
        cpu, memory   :
        gpu, driver   :
        command       :
        stage reached :
        crashes.log   :
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: The title files I ran are my own dump of my own copy.
          required: true
        - label: Nothing attached comes from the game or is derived from it.
          required: true
