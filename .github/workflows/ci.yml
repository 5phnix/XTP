# The checks every pull request must pass. Each job name is a required status
# check of the "Protect main" ruleset (docs/dev/maintainers.md); renaming a job
# means updating the ruleset in the same change. `cargo xtask pr-check` runs the
# same commands locally (xtask/src/pr_check.rs; a test keeps them in step).
#
# Runs on `pull_request` (a fork's PR gets a read-only token and no secrets),
# on the merge queue and on main. Actions are pinned to a commit; Dependabot
# keeps the pins current.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR replaces its running checks; main and the merge
  # queue always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes caches: pull requests reuse them and cannot
          # evict them or plant their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  clippy-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The diagnostics build (`--features diagnostics`) has code of its own.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No game files here: tests that need them skip (CONTRIBUTING.md, Tests).
      - run: cargo test --workspace --locked
      # The GPU tests again, on WARP under the D3D12 debug layer: a test fails
      # on the errors the layer raises on its thread (crates/xtp-gpu/src/
      # testgpu.rs). One test at a time, so errors of our own threads go to
      # the test that caused them. The layer comes with Graphics Tools.
      - name: Install Graphics Tools (the D3D12 debug layer)
        shell: pwsh
        run: |
          if (Test-Path "$env:WINDIR\System32\d3d12SDKLayers.dll") {
            "the D3D12 debug layer is installed"
          } else {
            Measure-Command {
              Add-WindowsCapability -Online -Name Tools.Graphics.DirectX~~~~0.0.1.0 | Out-Host
            } | ForEach-Object { "installed in $([int]$_.TotalSeconds) s" }
          }
      - name: GPU tests under the D3D12 debug layer
        env:
          XTP_TEST_ADAPTER: warp
          XTP_D3D12_DEBUG: "1"
          XTP_REQUIRE_GPU: "1"
        run: cargo test -p xtp-gpu --features diagnostics --locked -- --test-threads=1

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The asset policy (docs/asset-policy.md) on every file of the tree.
      - run: cargo xtask policy

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release binary checked against its published SHA-256; shellcheck,
      # preinstalled on the runner, checks the `run:` scripts.
      - name: Install actionlint 1.7.12
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
